services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ussd_wallet}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ussd_wallet}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PIN_PEPPER: ${PIN_PEPPER:?Set PIN_PEPPER in .env}
      USSD_GATEWAY_SECRET: ${USSD_GATEWAY_SECRET:?Set USSD_GATEWAY_SECRET in .env}
      USSD_SIMULATOR_ENABLED: ${USSD_SIMULATOR_ENABLED:-false}
      USSD_SIMULATOR_SECRET: ${USSD_SIMULATOR_SECRET:-}
      PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres_data:
