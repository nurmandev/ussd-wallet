spring:
  application:
    name: ussd-wallet
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ussd_wallet}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

wallet:
  number:
    prefix: ${WALLET_NUMBER_PREFIX:10}
    length: ${WALLET_NUMBER_LENGTH:10}
    max-retries: ${WALLET_NUMBER_MAX_RETRIES:5}
  currency: ${WALLET_CURRENCY:NGN}
  registration:
    initial-customer-status: ${REGISTRATION_INITIAL_CUSTOMER_STATUS:PENDING}
    rate-limit:
      max-requests: ${REGISTRATION_RATE_LIMIT_MAX_REQUESTS:10}
      window-seconds: ${REGISTRATION_RATE_LIMIT_WINDOW_SECONDS:60}

server:
  error:
    include-message: never
    include-stacktrace: never
