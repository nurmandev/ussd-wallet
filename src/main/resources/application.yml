spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ussd-wallet
  datasource:
    url: "${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ussd_wallet}}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

wallet:
  balance:
    max-requests-per-minute: ${WALLET_BALANCE_MAX_REQUESTS_PER_MINUTE:30}
  number:
    prefix: ${WALLET_NUMBER_PREFIX:10}
    length: ${WALLET_NUMBER_LENGTH:10}
    max-retries: ${WALLET_NUMBER_MAX_RETRIES:5}
  currency: ${WALLET_CURRENCY:NGN}
  transfer:
    minimum-amount: ${TRANSFER_MINIMUM_AMOUNT:0.01}
    maximum-amount: ${TRANSFER_MAXIMUM_AMOUNT:1000000.00}
    limits:
      daily-amount: ${TRANSFER_DAILY_AMOUNT_LIMIT:2000000.00}
      daily-count: ${TRANSFER_DAILY_COUNT_LIMIT:20}
      intent-expiry-seconds: ${TRANSFER_INTENT_EXPIRY_SECONDS:300}
      fee: ${TRANSFER_FEE:0.00}
  registration:
    initial-customer-status: ${REGISTRATION_INITIAL_CUSTOMER_STATUS:PENDING}
    rate-limit:
      max-requests: ${REGISTRATION_RATE_LIMIT_MAX_REQUESTS:10}
      window-seconds: ${REGISTRATION_RATE_LIMIT_WINDOW_SECONDS:60}

pin:
  security:
    max-failed-attempts: ${PIN_MAX_FAILED_ATTEMPTS:5}
    lockout-minutes: ${PIN_LOCKOUT_MINUTES:15}
    argon2-salt-length: ${PIN_ARGON2_SALT_LENGTH:16}
    argon2-hash-length: ${PIN_ARGON2_HASH_LENGTH:32}
    argon2-parallelism: ${PIN_ARGON2_PARALLELISM:1}
    argon2-memory-kib: ${PIN_ARGON2_MEMORY_KIB:65536}
    argon2-iterations: ${PIN_ARGON2_ITERATIONS:3}
    recovery-token-minutes: ${PIN_RECOVERY_TOKEN_MINUTES:5}
    pepper: ${PIN_PEPPER:}

ussd:
  service-code: ${USSD_SERVICE_CODE:*123#}
  session-timeout-seconds: ${USSD_SESSION_TIMEOUT_SECONDS:120}
  session-retention-seconds: ${USSD_SESSION_RETENTION_SECONDS:604800}
  max-requests-per-minute: ${USSD_MAX_REQUESTS_PER_MINUTE:30}
  gateway-secret: ${USSD_GATEWAY_SECRET:}
  simulator-secret: ${USSD_SIMULATOR_SECRET:}
  simulator-enabled: ${USSD_SIMULATOR_ENABLED:false}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
